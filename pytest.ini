[pytest]
# 指定测试代码所在的目录，pytest 只会在这个目录下查找测试文件
testpaths = tests

# 匹配测试文件的命名规则：只运行以 "test_" 开头的 Python 文件（如 test_utils.py）
python_files = test_*.py

# 匹配测试类的命名规则：只运行以 "Test" 开头的类（如 class TestDatabase）
python_classes = Test*

# 匹配测试函数的命名规则：只运行以 "test_" 开头的函数（如 def test_login()）
python_functions = test_*

# 默认命令行参数，每次运行 pytest 时自动启用
addopts = 
    -v                          # 显示详细测试名称（verbose 模式）
    --strict-markers            # 禁止使用未在 markers 中声明的标记，防止拼写错误
    --cov=src/evrag             # 启用覆盖率统计，仅统计 src/evrag 目录下的代码
    --cov-report=html           # 生成 HTML 格式的覆盖率报告（默认输出到 htmlcov/ 目录）
    --cov-report=term-missing   # 在终端中显示覆盖率，并标出未覆盖的代码行
    --cov-fail-under=80         # 如果总覆盖率低于 80%，测试视为失败（强制提升测试质量）

# 定义可用的测试标记（markers），用于分类和选择性运行测试
markers =
    unit: Unit tests            # 单元测试：测试单个函数或类，不依赖外部服务
    integration: Integration tests  # 集成测试：测试多个模块或与数据库/API 的交互
    slow: Slow running tests    # 慢速测试：耗时较长的测试（可通过 `-m "not slow"` 跳过）